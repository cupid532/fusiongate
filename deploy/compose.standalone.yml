name: fusiongate

# Production template for hosts that already provide their own reverse proxy.
# All application code and service behavior come from the checked-out commit;
# host-specific paths and the loopback port remain configurable environment data.
services:
  fusiongate:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        FUSIONGATE_BUILD_REVISION: ${FUSIONGATE_BUILD_REVISION:?set the exact Git commit}
        FUSIONGATE_BUILD_SOURCE: ${FUSIONGATE_BUILD_SOURCE:-https://github.com/cupid532/fusiongate}
        FUSIONGATE_BUILD_VERSION: ${FUSIONGATE_BUILD_VERSION:?set the FusionGate version}
    image: fusiongate:${FUSIONGATE_BUILD_REVISION}
    container_name: fusiongate
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - ${FUSIONGATE_ENV_FILE:-/opt/fusiongate/config/fusiongate.env}
    environment:
      FUSIONGATE_ADDR: 0.0.0.0:8787
      FUSIONGATE_DATA_DIR: /data
      FUSIONGATE_MASTER_KEY_FILE: /run/secrets/fusiongate_master_key
      FUSIONGATE_ADMIN_PASSWORD_FILE: /run/secrets/fusiongate_admin_password
    ports:
      - "127.0.0.1:${FUSIONGATE_PORT:-18787}:8787"
    volumes:
      - ${FUSIONGATE_DATA_PATH:-/opt/fusiongate/data}:/data
      - ${FUSIONGATE_MASTER_KEY_PATH:-/opt/fusiongate/config/master_key}:/run/secrets/fusiongate_master_key:ro
      - ${FUSIONGATE_ADMIN_PASSWORD_PATH:-/opt/fusiongate/config/admin_password}:/run/secrets/fusiongate_admin_password:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/fusiongate-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
