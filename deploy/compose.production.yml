name: fusiongate

services:
  fusiongate:
    build:
      context: ${FUSIONGATE_SOURCE_PATH}
      dockerfile: Dockerfile
      args:
        FUSIONGATE_BUILD_REVISION: ${FUSIONGATE_BUILD_REVISION:-unknown}
        FUSIONGATE_BUILD_SOURCE: ${FUSIONGATE_BUILD_SOURCE:-https://github.com/cupid532/fusiongate}
        FUSIONGATE_BUILD_VERSION: ${FUSIONGATE_BUILD_VERSION:-dev}
    image: fusiongate:production
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - ${FUSIONGATE_ENV_FILE}
    environment:
      FUSIONGATE_ADDR: 0.0.0.0:8787
      FUSIONGATE_DATA_DIR: /data
      FUSIONGATE_MASTER_KEY_FILE: /run/secrets/fusiongate_master_key
      FUSIONGATE_ADMIN_PASSWORD_FILE: /run/secrets/fusiongate_admin_password
    expose:
      - "8787"
    volumes:
      - ${FUSIONGATE_DATA_PATH:-../../data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 256
    secrets:
      - fusiongate_master_key
      - fusiongate_admin_password
    healthcheck:
      test: ["CMD", "/usr/local/bin/fusiongate-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      fusiongate:
        condition: service_healthy
    environment:
      FUSIONGATE_DOMAIN: ${FUSIONGATE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${FUSIONGATE_CADDYFILE_PATH}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_PATH:-../../caddy-data}:/data
      - ${CADDY_CONFIG_PATH:-../../caddy-config}:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    networks:
      - internal

networks:
  internal:
    driver: bridge

secrets:
  fusiongate_master_key:
    file: ${FUSIONGATE_MASTER_KEY_PATH}
  fusiongate_admin_password:
    file: ${FUSIONGATE_ADMIN_PASSWORD_PATH}
