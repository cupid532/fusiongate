name: Container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      oci-version: ${{ steps.version.outputs.oci_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^const Version = "\(V[0-9][0-9]*\.[0-9][0-9]\)"$/\1/p' internal/fusiongate/version.go)
          test -n "$source_version"
          test "$(cat VERSION)" = "$source_version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            expected_tag="v${source_version#V}"
            test "$GITHUB_REF_NAME" = "$expected_tag" || { echo "tag $GITHUB_REF_NAME does not match $expected_tag" >&2; exit 1; }
          fi
          echo "oci_version=${source_version#V}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend lint
        working-directory: web
        run: npm run lint
      - name: Frontend test
        working-directory: web
        run: npm test
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Frontend embed is current
        run: diff -qr web/dist internal/fusiongate/ui
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Deployment scripts parse
        run: |
          bash -n deploy/install.sh deploy/fusiongatectl
          sh -n deploy/healthcheck.sh
      - name: Vet
        run: go vet ./...
      - name: Test exact release source
        run: go test -race -shuffle=on -count=1 -timeout=20m ./...
      - name: Modules are tidy
        run: test -z "$(go mod tidy -diff)"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FUSIONGATE_BUILD_REVISION=${{ github.sha }}
            FUSIONGATE_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            FUSIONGATE_BUILD_VERSION=${{ needs.validate.outputs.oci-version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
