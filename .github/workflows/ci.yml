name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend lint
        working-directory: web
        run: npm run lint
      - name: Frontend test
        working-directory: web
        run: npm test
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Frontend embed is current
        run: diff -qr web/dist internal/fusiongate/ui
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Deployment scripts parse
        run: |
          bash -n deploy/install.sh deploy/fusiongatectl
          sh -n deploy/healthcheck.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -shuffle=on -count=1 -timeout=20m ./...

      - name: Modules are tidy
        run: test -z "$(go mod tidy -diff)"
      - name: Build
        run: go build ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fusiongate:ci
          build-args: |
            FUSIONGATE_BUILD_REVISION=${{ github.sha }}
            FUSIONGATE_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            FUSIONGATE_BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
